[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gluon-probe"
dynamic = ["version"]
description = "Read-only, deterministic discovery probe for agents inside host knowledge systems (import name: gluon; experimental, no stable API yet)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Gluon project" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Repository = "https://github.com/borwood/gluon-probe"
Documentation = "https://github.com/borwood/gluon-probe/blob/main/docs/host-integration.md"

[project.optional-dependencies]
rdflib = ["rdflib>=7.1,<8"]

[project.scripts]
gluon-probe = "gluon.__main__:main"

[tool.setuptools]
license-files = ["LICENSE"]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "gluon.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gluon = ["py.typed", "schema.json", "skills/*/SKILL.md"]
