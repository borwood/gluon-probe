name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install the package (editable)
        run: python -m pip install --no-build-isolation -e .
      - name: Unit tests
        run: python -X utf8 -m unittest discover -s tests -t . -v
      - name: Examples
        run: |
          python -X utf8 examples/billing.py
          python -X utf8 examples/host_integration.py
      - name: Wheel check (clean environment)
        run: python scripts/check_wheel.py
